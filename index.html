<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div class="quiz-container">
    <h1>Quiz</h1>
    <hr>

    <!-- Home page: topic selection -->
    <div class="topics" id="home">
      <div class="topic-card" onclick="startQuiz('music')">
        <h3>Music</h3>
        <p>5 Questions</p>
      </div>

      <div class="topic-card" onclick="startQuiz('movies')">
        <h3>Movies</h3>
        <p>5 Questions</p>
      </div>

      <div class="topic-card" onclick="startQuiz('sports')">
        <h3>Sports</h3>
        <p>5 Questions</p>
      </div>
    </div>

    <!-- One shared quiz section -->
    <section id="quiz-box" style="display:none">
      <p id="q-count">Question 1 of 5</p>

      <div class="progress-bar">
        <div id="progress"></div>
      </div>

      <h2 id="question-text"></h2>
      <div id="options"></div>

      <p id="score">Score: 0</p>

      <button id="next-btn" onclick="nextQuestion()" disabled>
        Next Question →
      </button>
    </section>

    <!-- Results section -->
    <section id="result-box" style="display:none">
      <h2>Quiz Complete!</h2>
      <div id="final-score"></div>
      <p id="final-text"></p>
      <div id="review"></div>

      <button onclick="restartQuiz()">Retake Quiz</button>
      <button onclick="goHome()">Choose Different Topic</button>
    </section>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
